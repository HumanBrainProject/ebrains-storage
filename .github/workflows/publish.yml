# adapted from https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/#workflow-definition
name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on: push

jobs:
  # try to build in every push
  # if fails, we should check if things are broken
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0  # setuptools_scm needs the tags to derive the version
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  # on tag, verify tag is {major}.{minor}.{bugfix}
  # to avoid pushing alpha/dev versions to pypi
  verify-tag:
    name: verify tag conforms
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: "Check tag conforms ^[0-9]+\\.[0-9]+\\.[0-9]+$"
      run: |
        trimmed_tag=${GITHUB_REF#refs/tags/}
        echo trimmed_tag='"'$trimmed_tag'"'
        [[ "$trimmed_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && exit 0 || exit 1

  # if both build and verify-tag passes
  # downloads build artefacts
  # uploads via twine
  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    - verify-tag
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: "Setup twine to upload artefacts"
      run: python -m pip install --user --upgrade twine

    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    # The ebrains-drive compatibility stub in compat/ is a separate
    # distribution, published once by hand rather than from here; see the
    # comment at the top of compat/pyproject.toml.
    - name: Publish distribution 📦 to PyPI (by twine)
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN_STORAGE }}
      run: python -m twine upload dist/*
