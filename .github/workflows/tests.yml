name: Tests

# Configure the events that are going to trigger tha automated update of the mirror
on:
  push:
    branches: [master]
  pull_request:

# Configure what will be updated
jobs:
  # set the job name
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
          - "3.9"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run tests
        run: pytest tests

      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov

  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          # - "3.13"
          # - "3.12"
          # - "3.11"
          # - "3.10"
          - "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run tests
        run: pytest e2e/ --durations=50

  # The ebrains-drive compatibility stub lives in compat/ and is a separate
  # distribution, so the main test run ignores it. These tests need both
  # installed.
  compat-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.9"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs the tags to derive the version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install both distributions
        # The stub requires ebrains-storage>=0.9.0. On a branch or pull request
        # there is no release tag, so setuptools_scm would derive a lower
        # development version and the requirement could not be satisfied;
        # pretending to be the release version keeps the real dependency
        # resolution in play.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.9.0"
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
          pip install ./compat

      - name: Run the alias tests
        run: pytest compat/tests
